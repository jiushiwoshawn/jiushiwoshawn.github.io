<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <style>
    .bg-dark, .fg-light { display: none; }
    @media (prefers-color-scheme: dark) {
      .bg-light, .fg-dark { display: none; }
      .bg-dark, .fg-light { display: block; }
    }
  </style>
  <!-- 浅色模式：奶油底 + 黑字 -->
  <rect class="bg-light" width="1024" height="1024" rx="230" fill="#F9ECD8"/>
  <text class="fg-dark" x="512" y="700" text-anchor="middle" font-family="Arial Black, Arial, Helvetica Neue, Helvetica, sans-serif" font-size="520" font-weight="900" fill="#000000">APT</text>
  <!-- 深色模式：近黑底 + 粉字 -->
  <rect class="bg-dark" width="1024" height="1024" rx="230" fill="#060500"/>
  <text class="fg-light" x="512" y="700" text-anchor="middle" font-family="Arial Black, Arial, Helvetica Neue, Helvetica, sans-serif" font-size="520" font-weight="900" fill="#F0B6C5">APT</text>
</svg>
